- id: wozniak-2026-dashboard-fault-diagnosis
  title: "Room for Improvement: Dashboard Design Approaches to Facilitate Smart Home Fault Diagnosis"
  year: 2026
  added: 2026-11-24
  collectedFrom: curated
  type: paper
  authors: "Woźniak, M. P., Müller, H., Mook, R., Koelle, M., & Boll, S."
  venue: "Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous Technologies (IMWUT)"
  institution: "Carl von Ossietzky Universität Oldenburg"
  fields: [hci]
  uses: [home-assistant]
  openAccess: true
  featured: 3
  summary: "A controlled study with 36 people comparing three smart home dashboard designs for tracking down faults: device lists, floor plans and dependency graphs. Floor plans and graphs led to more accurate diagnosis without extra effort, though people felt they did worse with the graphs."
  links:
    - { label: "Paper", url: "https://doi.org/10.1145/3810237" }
  notes: "Featured candidate from the copy doc (Annika). Mentions Home Assistant four times; confirm how it was used (Step 2). IMWUT is pre-approved."

