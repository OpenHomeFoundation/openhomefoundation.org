# FAQ content for the /community-day/ page's "Got some questions?" section
# (src/components/community-day/Faqs.astro).
#
# Each entry needs a `title` (the question) and `content` (the answer).
# `content` supports Markdown, so links can be added like:
#   content: "See our [Discord channel](https://discord.com/...) for details."
#
# - title: "Question goes here?"
#   content: "Answer goes here."
- title: "Where can I find more information about setting up a Community Day meetup for 2026?"
  content: "Check out the [blog post](#) from Missy, Community Manager at the Open Home Foundation, which details the process of getting started and what to expect as a host."
- title: "I’d like to share my event with my local community. Do you have a list of regional communities available?"
  content: "Absolutely – at the end of the [Home Assistant Community webpage](https://www.home-assistant.io/community#faq), you’ll find a list of regional Home Assistant communities. If yours is missing, [please email us](mailto:communityday@openhomefoundation.org) with a link to it so we can update the list!"
- title: "I missed the deadline to request official merchandise from the Open Home Foundation. Can I still order from the official store and get reimbursed?"
  content: "Unfortunately, we cannot reimburse any purchases made from our official store. However, if you [email us](mailto:communityday@openhomefoundation.org), we will send you the official assets to help you produce your own merch and will reimburse you for those purchases."
