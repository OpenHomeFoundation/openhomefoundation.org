# FAQ content for the /community-day/ page's "Got some questions?" section
# (src/components/community-day/Faqs.astro).
#
# Each entry needs a `title` (the question) and `content` (the answer).
# `content` supports Markdown, so links can be added like:
#   content: "See our [Discord channel](https://discord.com/...) for details."
# Write email addresses as plain text — they are turned into click-to-copy
# buttons automatically, so they need no markup of their own.
#
# - title: "Question goes here?"
#   content: "Answer goes here."
- title: "Where can I find more information about setting up a Community Day meetup for 2026?"
  content: "Check out the [blog post](/blog/countdown-to-community-day-2026-starts-now/) from Missy, Community Manager at the Open Home Foundation, which details the process of getting started and what to expect as a host."
- title: "I’d like to share my event with my local community. Do you have a list of regional communities available?"
  content: "Absolutely – in the FAQ of the [Home Assistant Community webpage](https://www.home-assistant.io/community/#faq), you’ll find a list of regional Home Assistant communities. If yours is missing, please email us at communityday@openhomefoundation.org with a link to it so we can update the list!"
- title: "I missed the deadline to request official merchandise from the Open Home Foundation. Can I still order from the official store and get reimbursed?"
  content: "Unfortunately, we cannot reimburse any purchases made from our official store. However, if you email us at communityday@openhomefoundation.org, we will send you the official assets to help you produce your own merch and will reimburse you for those purchases."
- title: "What if I need some more help?"
  content: "The [#community-day](https://discord.com/channels/330944238910963714/1537054268933144677) channel in Discord is where you can chat with other hosts to share ideas for activities you’ll have at your meetups, and make threads to talk more closely with your own guests. I’ll hang out in there as well to answer any questions you may have, and keep hosts updated on the latest news. If you don’t have Discord, or simply prefer email communications, we’ll happily provide the same support when you email us at communityday@openhomefoundation.org."
